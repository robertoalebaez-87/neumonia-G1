[project]
name = "neumonia"
version = "0.1.0"
description = "Herramienta para la detección rápida de neumonía en radiografías de tórax con Grad-CAM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Roberto", email = "roberto_ale.baez@uaovirtual.edu.co" }]
keywords = ["neumonia", "deep-learning", "grad-cam", "dicom", "radiografia", "tkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.16",
    "opencv-python>=4.9",
    "pydicom>=2.4",
    "tkcap>=0.0.4",
    "img2pdf>=0.5",
    "pyautogui>=0.9.54",
]

[project.urls]
Homepage = "https://github.com/robertoalebaez-87/neumonia-G1"
Repository = "https://github.com/robertoalebaez-87/neumonia-G1"
Issues = "https://github.com/robertoalebaez-87/neumonia-G1/issues"

[project.scripts]
neumonia = "neumonia.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neumonia"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/load_model.py" = "load_model.py"
"src/read_img.py" = "read_img.py"
"src/preprocess_img.py" = "preprocess_img.py"
"src/grad_cam.py" = "grad_cam.py"
"src/integrator.py" = "integrator.py"
"src/ui.py" = "ui.py"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["neumonia"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/neumonia"]
branch = true

[tool.ty.rules]
import-not-found = "ignore"

[tool.coverage.report]
show_missing = true
