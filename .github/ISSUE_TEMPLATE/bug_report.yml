name: Bug report
description: Reportar un comportamiento inesperado
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción del error
      description: ¿Qué ocurrió?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      placeholder: "SO, versión de Python, versión de uv"
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      render: shell
