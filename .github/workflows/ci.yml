name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Instalar Python
        run: uv python install 3.13
      - name: Sincronizar dependencias
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run ty check
      - name: Pruebas
        run: uv run pytest
